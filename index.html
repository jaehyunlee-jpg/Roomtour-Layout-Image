<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>間取りイラスト変換ツール</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f3;color:#1a1a1a;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px}
.card{background:#fff;border-radius:16px;border:1px solid #e5e5e3;padding:32px;width:100%;max-width:680px}
h1{font-size:18px;font-weight:600;margin-bottom:4px}
.sub{font-size:13px;color:#888;margin-bottom:24px}
.badge{display:inline-block;font-size:11px;padding:2px 10px;border-radius:99px;background:#f0f0ee;color:#888;border:1px solid #e5e5e3;float:right;margin-top:2px}
.sl{font-size:11px;color:#999;text-transform:uppercase;letter-spacing:.07em;font-weight:600;margin-bottom:10px}
.uz{border:1.5px dashed #d0d0ce;border-radius:12px;padding:36px 20px;text-align:center;cursor:pointer;background:#fafaf8;margin-bottom:24px}
.uz:hover{background:#f0f4ff;border-color:#4a7ff5}
.uz p{font-size:14px;color:#555;margin-bottom:4px}
.uz span{font-size:12px;color:#aaa}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.sc{border:1px solid #e5e5e3;border-radius:10px;padding:12px 14px;cursor:pointer;text-align:center}
.sc:hover{background:#fafaf8}
.sc.selected{border-color:#4a7ff5;background:#f0f4ff}
.sc strong{font-size:13px;font-weight:600;display:block;margin-bottom:2px}
.sc span{font-size:11px;color:#888}
textarea{width:100%;font-size:13px;resize:vertical;border-radius:8px;padding:10px 12px;border:1px solid #e0e0de;background:#fafaf8;color:#1a1a1a;font-family:inherit;outline:none;margin-bottom:20px}
textarea:focus{border-color:#4a7ff5}
.pg{display:none;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.pg.active{display:grid}
.pb{border-radius:10px;overflow:hidden;border:1px solid #e5e5e3}
.pb img{width:100%;height:240px;object-fit:contain;display:block;background:#fafaf8;padding:8px}
.bl{font-size:12px;color:#999;padding:8px 12px;border-top:1px solid #f0f0ee}
.ep{border-radius:10px;border:1px solid #e5e5e3;background:#fafaf8;padding:28px 20px;text-align:center;margin-bottom:16px}
.ep p{font-size:13px;color:#bbb}
.ar{display:flex;gap:10px}
.btn{padding:11px 20px;font-size:14px;font-weight:500;border-radius:10px;border:1px solid #e0e0de;cursor:pointer;background:#fff;color:#1a1a1a;font-family:inherit}
.btn:disabled{opacity:.4;cursor:not-allowed}
.bp{flex:1;background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.bp:hover:not(:disabled){background:#333}
.bd{display:none}
.bd.active{display:block}
.st{font-size:13px;color:#888;margin-top:10px;min-height:20px}
.st.success{color:#2a9d5c}
.st.error{color:#d04040}
hr{border:none;border-top:1px solid #f0f0ee;margin:20px 0}
.sp{display:inline-block;width:14px;height:14px;border:2px solid #ccc;border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="card">
<span class="badge">エディター専用</span>
<h1>間取り → イラスト変換</h1>
<p class="sub">ユーザーの間取り図をAIでイラスト化します</p>

<p class="sl">1. 間取り図をアップロード</p>
<div class="uz" id="uz" onclick="document.getElementById('fi').click()">
<p>クリックまたはドラッグ＆ドロップ</p>
<span>PNG / JPG · 最大10MB</span>
</div>
<input type="file" id="fi" accept="image/*" style="display:none">

<p class="sl">2. スタイル選択</p>
<div class="sg">
<div class="sc selected" data-style="line" onclick="sel(this)"><strong>シンプル線画</strong><span>白黒・建築図面風</span></div>
<div class="sc" data-style="sketch" onclick="sel(this)"><strong>スケッチ風</strong><span>手書き・やわらか</span></div>
<div class="sc" data-style="blueprint" onclick="sel(this)"><strong>ブループリント</strong><span>青地・白線</span></div>
<div class="sc" data-style="anime" onclick="sel(this)"><strong>アニメ風</strong><span>カラー・イラスト</span></div>
<div class="sc" data-style="watercolor" onclick="sel(this)"><strong>水彩風</strong><span>やわらかい色彩</span></div>
<div class="sc" data-style="minimal" onclick="sel(this)"><strong>ミニマル</strong><span>シンプル・モダン</span></div>
</div>

<p class="sl">3. 追加指示（任意）</p>
<textarea id="ep" rows="2" placeholder="例：バルコニーを省略してください / 北側の窓を強調してください"></textarea>

<div class="ep" id="emp"><p>画像をアップロードするとプレビューが表示されます</p></div>
<div class="pg" id="pg">
<div class="pb"><img id="oi" src="" alt="元の間取り図"><div class="bl">元画像</div></div>
<div class="pb"><img id="ri" src="" alt="変換後" style="display:none;width:100%;height:240px;object-fit:contain;padding:8px"><div id="rp" style="height:240px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#bbb">変換ボタンで生成</div><div class="bl">変換後（AI）</div></div>
</div>

<div class="ar">
<button class="btn bp" id="cb" disabled onclick="conv()">AIで変換</button>
<button class="btn bd" id="db" onclick="dl()">PNG保存</button>
</div>
<div class="st" id="sb"></div>
</div>

<script>
let ss='line', uf=null, resultB64=null;

function sel(e){document.querySelectorAll('.sc').forEach(c=>c.classList.remove('selected'));e.classList.add('selected');ss=e.dataset.style}

const uz=document.getElementById('uz');
uz.addEventListener('dragover',e=>{e.preventDefault();uz.style.background='#f0f4ff'});
uz.addEventListener('dragleave',()=>uz.style.background='');
uz.addEventListener('drop',e=>{e.preventDefault();uz.style.background='';if(e.dataTransfer.files[0])hf(e.dataTransfer.files[0])});
document.getElementById('fi').addEventListener('change',e=>{if(e.target.files[0])hf(e.target.files[0])});

function hf(f){
  uf=f;
  const r=new FileReader();
  r.onload=e=>{
    document.getElementById('oi').src=e.target.result;
    document.getElementById('emp').style.display='none';
    document.getElementById('pg').classList.add('active');
    document.getElementById('cb').disabled=false;
    document.getElementById('ri').style.display='none';
    document.getElementById('rp').style.display='flex';
    document.getElementById('db').classList.remove('active');
    resultB64=null;
    uz.querySelector('p').textContent=f.name;
    uz.querySelector('span').textContent=(f.size/1024).toFixed(0)+' KB';
    st('');
  };
  r.readAsDataURL(f);
}

async function conv(){
  if(!uf)return;
  const btn=document.getElementById('cb');
  btn.disabled=true;
  btn.innerHTML='<span class="sp"></span>AI変換中... (30秒ほどかかります)';
  st('Hugging FaceのAIが処理中です...');

  const reader=new FileReader();
  reader.onload=async e=>{
    const base64=e.target.result.split(',')[1];
    const mediaType=uf.type||'image/jpeg';
    const extra=document.getElementById('ep').value.trim();

    try{
      const resp=await fetch('/api/convert',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({image:base64,mediaType,style:ss,extra})
      });
      const data=await resp.json();
      if(!resp.ok)throw new Error(data.error||'エラーが発生しました');

      if(data.type==='image'&&data.result){
        resultB64=data.result;
        document.getElementById('ri').src='data:image/png;base64,'+data.result;
        document.getElementById('ri').style.display='block';
        document.getElementById('rp').style.display='none';
        document.getElementById('db').classList.add('active');
        st('変換完了！','success');
      } else {
        throw new Error('画像の生成に失敗しました');
      }
    }catch(e){
      st(e.message,'error');
    }
    btn.disabled=false;
    btn.innerHTML='AIで変換';
  };
  reader.readAsDataURL(uf);
}

function st(m,t){const e=document.getElementById('sb');e.textContent=m;e.className='st'+(t?' '+t:'')}

function dl(){
  if(!resultB64)return;
  const a=document.createElement('a');
  a.download='madori_illust_'+Date.now()+'.png';
  a.href='data:image/png;base64,'+resultB64;
  a.click();
}
</script>
</body>
</html>
